upstream web {
    server web:3000;
}

upstream api {
    server api:3001;
}

upstream admin {
    server admin:3002;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=web:10m rate=300r/m;

server {
    listen 80;
    server_name yourstore.com www.yourstore.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourstore.com www.yourstore.com;

    ssl_certificate /etc/ssl/certs/yourstore.crt;
    ssl_certificate_key /etc/ssl/private/yourstore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_vary on;

    # Next.js storefront
    location / {
        limit_req zone=web burst=50 nodelay;
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # NestJS API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        proxy_pass http://web;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Admin dashboard
server {
    listen 443 ssl http2;
    server_name admin.yourstore.com;

    ssl_certificate /etc/ssl/certs/yourstore.crt;
    ssl_certificate_key /etc/ssl/private/yourstore.key;

    # IP restriction for admin (optional)
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
